<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcements</title>
  <script src="archive.js" defer></script>
</head>
<body>
  <h1>Announcements</h1>
  <article class="announcement" data-posted="2026-10-24">
    <h2>Library notice</h2>
    <p>The library is open today.</p>
  </article>
  <p id="posted-date"></p>
  <button id="toggle-archive" type="button"
    aria-controls="archive" aria-expanded="false">Show archive</button>
  <p id="archive" hidden>Older announcements are available on request.</p>
</body>
</html>
