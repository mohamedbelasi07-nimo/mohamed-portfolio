<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <style>
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Library Gallery</h1>
  <figure>
    <img src="images/reading-room.png"
      alt="Reading room with two desks and a bookshelf"
      width="400" height="240">
    <figcaption>The library reading room.</figcaption>
  </figure>
  <img src="images/bookshelf.png"
    alt="Books arranged on three library shelves"
    width="400" height="240">
  <img src="images/divider.png" alt="" width="400" height="24">
  <a href="https://example.com/">
    <img src="images/visit.png" alt="Visit Example Domain"
      width="240" height="80">
  </a>
</body>
</html>
