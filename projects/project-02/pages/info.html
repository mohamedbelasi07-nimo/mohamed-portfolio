<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Information</title>
  
</head>
<body>
  <h1>Information</h1>
  <p>This page is the relative-link and query-string target.</p>
  <a href="../links.html">Back to the link examples</a>
<script>
// Deployment adapter: the answer's source retains the required root-relative paths.
const exerciseRoot = new URL("../", location.href).pathname;
for (const element of document.querySelectorAll('[href^="/"]')) {
  element.setAttribute('href', exerciseRoot + element.getAttribute('href').slice(1));
}
</script>
</body>
</html>
