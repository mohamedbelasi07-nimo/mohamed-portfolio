<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Examples</title>
  
</head>
<body>
  <h1>Link Examples</h1>
  <ul>
    <li><a href="https://example.com/">Absolute link</a></li>
    <li><a href="pages/info.html">Relative subfolder link</a></li>
    <li><a href="pages/../index.html">Link using ../</a></li>
    <li><a href="/index.html">Root-relative link</a></li>
    <li><a href="pages/info.html?topic=html">Query-string link</a></li>
    <li><a href="#details">Fragment link</a></li>
  </ul>
  <section id="details">
    <h2>Details</h2>
    <p>This is the fragment target.</p>
  </section>
<script>
// Deployment adapter: the answer's source retains the required root-relative paths.
const exerciseRoot = new URL("./", location.href).pathname;
for (const element of document.querySelectorAll('[href^="/"]')) {
  element.setAttribute('href', exerciseRoot + element.getAttribute('href').slice(1));
}
</script>
</body>
</html>
